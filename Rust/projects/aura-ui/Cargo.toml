[package]
name = "aura-ui"
version = "0.1.0"
edition = "2024"
description = "Aura UI — a high-level desktop UI framework built entirely on GPUI"
license = "MIT"
keywords = ["ui", "gui", "gpui", "desktop", "framework"]
categories = ["gui"]

[lib]
name = "aura_ui"
path = "src/lib.rs"

[[example]]
name = "showcase"
path = "examples/showcase.rs"

[[example]]
name = "thing"
path = "examples/thing.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
